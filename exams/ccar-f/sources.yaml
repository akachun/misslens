# Collector targets (ARCHITECTURE §9, CLAUDE.md rule 7). Only URLs listed here are collected.
# Approved 2026-11-05: in-house material import and the course site's terms (TASK.md '확인 대기').
#
# expand: lessons  -> open the course page and collect only its lesson links: same host, path
#                     /<course-slug>/<one more segment>, one level deep (D38). Nothing else is followed.
# Lesson lists appear only after login and enrollment. Enroll in each course yourself in the login window;
# the Collector never clicks "Enroll" or submits anything (read-only).

sites:
  skilljar:
    login_url: https://anthropic-partners.skilljar.com/auth/login
    allowed_domains: [anthropic-partners.skilljar.com]
    expired_markers: [/auth/login, /auth/signin]   # redirected here = session expired -> interrupt② (login wait)
    not_enrolled_markers: [/checkout/]             # course needs enrollment: reported, skipped
    delay_seconds: 2.5                             # at least 2 s between requests (§9)
    # Page chrome to drop before saving (D48). 29% of chunks carried the video player's menus otherwise.
    drop_lines:                                    # whole lines (regex, full match)
      - 'Courses|Certifications and badges|Anthropic Open in Claude|Anthropic|Open in Claude'
      - 'Ask questions about this course|Copy notes|Copy full course notes for LLMs'
    drop_blocks:                                   # from a start line through the last end line in a row
      - {start: '.* of .*Volume \d+%', end: 'Uh oh! Something went wrong, please try again\.|This video is still being processed.*'}

# Source: https://anthropic-partners.skilljar.com/page/claude-certified-architect-foundations-prep-courses
