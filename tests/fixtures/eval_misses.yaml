      - Locally, the same command opens an interactive session
    first_choice: 2
    self_label: {miss_type: concept, missed_phrase: null}
    note: Did not know -p as the non-interactive mode for CI.

  - id: m02
    is_decoy: false
    domain: null
    task_id: null
    stem_en: |
      A developer migrating from another provider's chat API builds the request like this: messages: [{role: "system", content: "You are a code reviewer..."}, {role: "user", content: diff}].

      Every request is rejected with a 400 invalid request error.

      What change should the developer make?
    options_en:
      - Move the instructions out of the messages array into the top-level system parameter, and keep only user and assistant roles in messages.
      - Change the role from "system" to "assistant" so the instructions come before the user message.
      - Retry the request with exponential backoff, since 400 errors are usually transient.
      - Merge the instructions and the diff into one long user message and remove the system prompt entirely.
    answer_index: 0
    key_constraints:
      - 'role: "system"'
      - rejected with a 400 invalid request error
    violates:
      - null
      - 'role: "system"'
      - rejected with a 400 invalid request error
      - 'role: "system"'
    first_choice: 3
    self_label: {miss_type: uncertain, missed_phrase: rejected with a 400}
    note: >-
      Rule-derived phrase (violates[D] = role: "system") differs from the learner's phrase.
      D removes the error but is a workaround, not the fix for the misplaced system role.

  - id: m03
    is_decoy: false
    domain: null
    task_id: null
    stem_en: |
      Scenario: Northwind Logistics document pipeline

      Northwind Logistics processes about 40,000 shipping documents per day from roughly 300 carriers: bills of lading, commercial invoices, and customs declarations, most of them scanned PDFs. Each document type has its own extraction tool with a JSON schema, and Claude is called once per document as soon as it arrives. The extracted data feeds a customs filing system, which rejects any filing whose totals do not match or whose dates are not in YYYY-MM-DD format. Filings must be submitted within 12 hours of a document's arrival.

      The six-person engineering team works mostly in TypeScript, and the company moved its infrastructure to the cloud in 2023.

      The team has reported four problems:

      (a) About 4% of commercial invoices are rejected because the extracted line-item amounts do not add up to the extracted total, even though the source documents are correct.
      (b) Date fields come back in mixed formats, such as 03/04/2025, 4 March 2025, and 2025-03-04.
      (c) For customs declarations from 12 recently added carriers with unusual layouts, the declared_value field is often filled with the freight charge instead.
      (d) Monthly API spending is 40% over budget. All documents are currently processed with real-time requests.

      Refer to the Northwind Logistics scenario above. Consider problem (c).

      What is the most effective way to address problem (c)?
    options_en:
      - Fine-tune a custom model on documents from the 12 new carriers.
      - Make declared_value nullable for the 12 new carriers.
      - Increase max_tokens so the model can read the whole layout.
      - Clarify in the declared_value field description how it differs from freight charges, and add few-shot examples from the new carriers' layouts that show which value is the declared value.
    answer_index: 3
    key_constraints:
      - 12 recently added carriers with unusual layouts
      - filled with the freight charge instead
      - The extracted data feeds a customs filing system
    violates:
      - 12 recently added carriers with unusual layouts
      - The extracted data feeds a customs filing system
      - filled with the freight charge instead
      - null
    first_choice: 1
    self_label: {miss_type: uncertain, missed_phrase: null}
    note: >-
      Possibly transferred the "make it nullable" fix from m05 (answered correctly).
      There the value is absent; here it is present but mis-picked.

