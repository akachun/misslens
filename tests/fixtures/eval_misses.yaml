# T1-a eval fixture: real misses from the learner, labeled by the learner (ground truth).
#
# Source: practice questions generated while studying with Claude (no third-party prep site).
# Labels were assigned retrospectively: the learner had already read the explanations,
# so re-solving would have biased every miss toward "reading" (ARCHITECTURE §4.2, D14).
#
# Fields
#   options_en / answer_index / first_choice : 0-based (A=0, B=1, C=2, D=3)
#   key_constraints : exact substrings of stem_en (checked by tests/test_eval_fixture.py)
#   violates        : per option, the key_constraint that option breaks; null only at answer_index
#   self_label      : learner's own judgement. miss_type in {concept, reading, uncertain}; null for decoys
#                     missed_phrase = phrase the learner says they missed (may differ from the rule below)
#   Rule-derived missed_phrase (§4.2) = violates[first_choice]; compare with self_label.missed_phrase in eval.
#   domain / task_id : filled at T2-c when exams/ccar-f/exam.yaml is finalized
#   violates/key_constraints are a draft by Claude; edit if they do not match how you read the question.

