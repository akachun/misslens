    stem_en: |
      You extract fields from supplier invoices into JSON using tool use with a JSON schema. All fields in the schema, including purchase_order_number, are marked as required.

      About 15% of invoices do not contain a purchase order number. For those invoices, the output always contains a plausible-looking purchase order number that does not exist anywhere in the document.

      What is the best way to fix this?
    options_en:
      - Add a validation step that retries the extraction until a purchase order number is found in the document.
      - Increase max_tokens so the model has room to search the whole invoice.
      - Remove purchase_order_number from the schema entirely.
      - Make purchase_order_number nullable in the schema and instruct the model to return null when the field is not present in the document.
    answer_index: 3
