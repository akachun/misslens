    stem_en: |
      Your team adds a GitHub Actions step that runs Claude Code to review every pull request and post its findings as a comment.

      In testing, the step never finishes: the job hangs until it is killed by the workflow timeout. Locally, the same command opens an interactive session.

      What should you change so the step works in the pipeline?
    options_en:
      - Run Claude Code with the -p (print) flag so it runs non-interactively, and use --output-format json if the next step needs to parse the result.
      - Increase the GitHub Actions job timeout to 60 minutes.
      - Send the review requests through the Message Batches API instead.
      - Add "Do not wait for user input" to the project's CLAUDE.md.
    answer_index: 0
    key_constraints:
      - the job hangs until it is killed by the workflow timeout
      - Locally, the same command opens an interactive session
      - runs Claude Code
    violates:
