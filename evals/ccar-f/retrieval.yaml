# Golden queries for retrieval evaluation (src/misslens/retrieval/evaluate.py, D50).
#
# A retrieved chunk counts as relevant when it contains every `text` phrase (case-insensitive) and, if given,
# its source contains `source`. `expect` lists alternatives (any one is enough). Judging by content rather than
# chunk ids keeps the set valid after re-chunking or cleaning.
#
# Every item was checked to have at least one relevant chunk in the index built on 2026-11-05 (guide PDF,
# 17labs pages, 7 Skilljar courses). Korean queries mirror how the learner asks the coach.
# task_id is used by the coach and task ranking modes; leave it out for questions not tied to a task statement.

exam_id: ccar-f
items:
  # --- d1 Agentic architecture & orchestration
  - {id: d1-loop, domain: d1, task_id: "1.1", query: "agentic loop keeps running while stop_reason is tool_use",
     expect: [{text: [stop_reason]}]}
  - {id: d1-coordinator-ko, domain: d1, task_id: "1.2", query: "코디네이터가 여러 서브에이전트에게 작업을 나눠 맡기는 패턴",
     expect: [{text: [subagent, coordinator]}]}
  - {id: d1-context, domain: d1, task_id: "1.3", query: "subagents do not inherit the coordinator's context, pass it explicitly in the prompt",
     expect: [{text: [subagent, context]}]}
  - {id: d1-hooks, domain: d1, task_id: "1.5", query: "hook that runs before a tool call and can block it",
     expect: [{text: [PreToolUse]}, {text: [hook, tool call]}]}
  - {id: d1-resume, domain: d1, task_id: "1.7", query: "resume an earlier session or fork it",
     expect: [{text: ["--resume"]}, {text: [fork_session]}]}

