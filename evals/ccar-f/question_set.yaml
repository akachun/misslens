# 문제 생성 품질 평가용 인-아웃 세트(D59).
# 입력(in): 세부 항목 20개. 라운드마다 같은 세부 항목으로 문제를 새로 만든다.
# 기대(out): 1라운드 문제(샌드박스 기록의 문제 ID 1~20)에 대한 외부 검토(Claude Opus·GPT 교차 검토, 2026-11-05)의
#   합의 판정. 판정기(LLM-as-Judge)의 보정에만 쓴다.
# round2: 2라운드 문제(평가용 DB 세트 1, 같은 순서의 번호)에 대한 외부 검토(Opus·GPT 교차 검토 최종안, 2026-11-06) 합의.
#   issues는 두 검토가 모두 지적한 유형, issues_any는 한쪽이라도 지적한 유형. options는 오답 보기별 violates 종류(kind)와
#   유효 여부(valid: 요구사항이고 틀린 진짜 이유인가). 두 검토가 다르면 null. 생성에 실패한 세부 항목은 round2: null.
# issues 값: violates(오답 근거가 요구사항이 아니거나 틀린 이유가 아님), multiple(복수 정답),
#   fact(사실 오류), translation(번역), fit(시험 적합성: 정답 노출, 중복 오답, 비현실적 상황), stem(지문 모순)
exam_id: ccar-f
round1_source: data/sandbox/ledger.sqlite
